name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar v0.3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android 35
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/logica-do-preco-ai-v0.3-debug.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Publicar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: logica-do-preco-ai-v0.3-debug
          path: dist/
          if-no-files-found: error

      - name: Publicar pré-release para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-dev >/dev/null 2>&1; then
            gh release upload v0.3.0-dev dist/logica-do-preco-ai-v0.3-debug.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create v0.3.0-dev dist/logica-do-preco-ai-v0.3-debug.apk dist/SHA256SUMS.txt --title "Lógica do Preço AI v0.3 (teste de captura)" --notes "APK de estudos v0.3: captura, overlay, classificações preliminares do PDF. NÃO opera automaticamente e NÃO oferece sinais validados." --prerelease
          fi
